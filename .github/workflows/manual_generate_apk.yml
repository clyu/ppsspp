name: Generate Android APK
on:
  workflow_dispatch: {}
  push:
    paths-ignore:
      # Deliberately no '**.txt' here: that would swallow CMakeLists.txt and assets/gamecontrollerdb.txt.
      - '**.md'
      - 'Tools/**'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - 'appveyor.yml'

# A full native build is expensive, so superseded runs on the same ref are cancelled.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:

  apk:
    name: Generate NormalOptimized APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check Valid Version Tags
        id: valid-tags
        shell: bash
        run: |
          echo "count=$(git tag -l 'v[0-9]*' | wc -l | tr -d ' ')" >> $GITHUB_OUTPUT

      - name: Fetch upstream tags # required for git describe to return a valid version, otherwise the APK version falls back to v0.0.0 on a new fork
        if: steps.valid-tags.outputs.count == '0'
        run: |
          # TODO: should try to fetch tags from whereever this repo was forked from before fetching from official repo
          git remote add upstream https://github.com/hrydgard/ppsspp.git # fetching from official repo as a fallback
          git fetch --deepen=15000 --no-recurse-submodules --tags --force upstream || exit 0

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # The SDK and the NDK version pinned by android/build.gradle.kts are both
      # preinstalled on the ubuntu-latest runner, so no setup steps are needed.

      - name: Assemble APK
        # android.injected.build.abi keeps the native build down to one ABI, but AGP reads that
        # property as "the IDE is deploying to a device" and stamps android:testOnly="true" onto
        # the manifest, which the package installer then refuses to install. Setting
        # android.injected.testOnly explicitly short-circuits that inference -- see
        # ComponentUtils.isTestApk() in the Android Gradle plugin.
        run: |
          echo "Valid version tags: ${{ steps.valid-tags.outputs.count }}"
          ./gradlew assembleNormalOptimized \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Pandroid.injected.testOnly=false \
            --stacktrace

      - name: Package build
        run: |
          mkdir ppsspp
          find android/build -name "*.apk" -exec cp -v '{}' ppsspp/ \;
          ls -l ppsspp/
          [ -n "$(ls -A ppsspp)" ] || { echo "::error::No APK was produced"; exit 1; }

      - name: Verify the APK is installable
        run: |
          AAPT2=$(ls -1 "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n1)
          if [ -z "$AAPT2" ]; then
            echo "::warning::aapt2 not found, skipping the manifest check"
            exit 0
          fi
          "$AAPT2" dump xmltree --file AndroidManifest.xml ppsspp/*.apk > manifest.txt
          if grep -q 'testOnly' manifest.txt; then
            echo "::error::APK is marked android:testOnly, the package installer will reject it"
            exit 1
          fi
          grep -E 'versionName|package=' manifest.txt | head -n 5

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ppsspp-normal-optimized-arm64-v8a
          path: ppsspp/
